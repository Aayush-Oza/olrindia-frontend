<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overview - OLR Admin</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css?v=13">
  <link rel="stylesheet" href="../css/base.css?v=13">
  <link rel="stylesheet" href="../css/components.css?v=13">
  <link rel="stylesheet" href="../css/admin/admin-dashboard.css?v=13">
</head>
<body>
  <div id="dashRoot">
    <nav class="dash-nav">
      <div class="dash-nav-inner">
        <a class="dash-nav-logo" href="/admin/overview"><img src="../assets/logo.png?v=13" alt="OLR India"></a>
        <div class="dash-nav-links">
          <a class="nav-link active" href="/admin/overview">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
            Overview
          </a>
          <a class="nav-link" href="/admin/products">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 8v13H3V8M1 3h22v5H1V3ZM10 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Products
          </a>
          <a class="nav-link" href="/admin/users">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 21v-1a7 7 0 0 1 14 0v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="11" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/></svg>
            Users
          </a>
          <a class="nav-link" href="/admin/vendors">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 9.5 12 3l9 6.5M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Vendors
          </a>
        </div>
        <div class="dash-nav-right">
          <div class="dash-nav-user">
            <div class="nav-avatar" id="navAdminAvatar"></div>
            <span class="name" id="navAdminName"></span>
          </div>
          <button class="nav-btn nav-btn-ghost" id="logoutBtn">Log out</button>
        </div>
        <button class="nav-hamburger" id="hamburgerBtn" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
      <div class="nav-mobile-menu" id="mobileMenu">
        <a class="mobile-nav-link active" href="/admin/overview">Overview</a>
        <a class="mobile-nav-link" href="/admin/products">Products</a>
        <a class="mobile-nav-link" href="/admin/users">Users</a>
        <a class="mobile-nav-link" href="/admin/vendors">Vendors</a>
        <button class="nav-btn nav-btn-ghost" id="logoutBtnMobile" style="width:100%;justify-content:center;margin-top:4px;">Log out</button>
      </div>
    </nav>

    <div class="dash-page">
      <div class="dash-panel active" id="panel-overview">
        <div class="panel-head"><h2>Overview</h2></div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-label">Total users</div><div class="stat-value" id="statUsers">–</div></div>
          <div class="stat-card"><div class="stat-label">Total vendors</div><div class="stat-value" id="statVendors">–</div></div>
          <div class="stat-card"><div class="stat-label">Total products</div><div class="stat-value" id="statProducts">–</div></div>
          <div class="stat-card"><div class="stat-label">Live products</div><div class="stat-value" id="statActiveProducts">–</div></div>
          <div class="stat-card stat-card-warn"><div class="stat-label">Flagged vendors</div><div class="stat-value" id="statFlagged">–</div></div>
          <div class="stat-card stat-card-danger"><div class="stat-label">Suspended vendors</div><div class="stat-value" id="statSuspended">–</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
      <h3 class="modal-title" id="confirmTitle"></h3>
      <p class="modal-text" id="confirmText"></p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="confirmCancel"></button>
        <button class="btn btn-primary" id="confirmOk"></button>
      </div>
    </div>
  </div>
  <div id="toast-container"></div>

  <script src="../js/api.js?v=13"></script>
  <script src="../js/shared/utils.js?v=13"></script>
  <script src="../js/ui.js?v=13"></script>
  <script src="../js/helpers.js?v=13"></script>
  <script src="../js/admin/admin-nav.js?v=13"></script>
  <script src="../js/admin/admin_overview.js?v=13"></script>
</body>
</html>
