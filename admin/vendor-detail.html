<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Details - OLR India Admin</title>
    <link rel="stylesheet" href="../css/components.css?v=2">
    <link rel="stylesheet" href="../css/variables.css?v=2">
    <link rel="stylesheet" href="../css/admin-dashboard.css?v=2">
    <link rel="stylesheet" href="../css/vendor-detail.css?v=2">
</head>

<body>

    <div class="admin-detail-page">

        <a href="dashboard.html#vendors" class="admin-back-link">&larr; Back to Vendors</a>

        <div id="vendorInfoCard" class="admin-vendor-info-card">
            <!-- filled by JS -->
        </div>

        <h2 class="admin-section-title">Strike History</h2>
        <div id="vendorStrikesList" class="admin-strikes-list">
            <!-- filled by JS -->
        </div>

        <h2 class="admin-section-title">Live Products</h2>
        <div id="vendorProductsGrid" class="admin-product-cards-grid">
            <!-- filled by JS -->
        </div>

    </div>
<!-- ── SUSPEND VENDOR MODAL ────────────────────────────────────── -->
<div class="product-modal-overlay" id="suspendModal">
  <div class="product-modal-box">
    <h3 class="product-modal-title">Suspend this vendor?</h3>
    <p class="product-modal-text">Their account will be locked immediately and all listings hidden. Enter a reason - this will be emailed to them.</p>
    <textarea class="input" id="suspendReasonInput" rows="4"
      placeholder="e.g. Multiple complaints received about fraudulent listings."
      style="margin:12px 0;"></textarea>
    <div class="product-modal-actions">
      <button class="btn btn-secondary" id="suspendCancel">Cancel</button>
      <button class="btn btn-primary" id="suspendConfirm" style="background:var(--c-error);">Suspend & notify vendor</button>
    </div>
  </div>
</div>
    <script src="../js/api.js?v=4"></script>
    <script src="../js/helpers.js?v=2"></script>
    <script src="../js/ui.js?v=1"></script>
    <script src="../js/vendor-detail.js?v=6"></script>
</body>

</html>
