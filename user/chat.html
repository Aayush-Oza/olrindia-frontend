    <!-- ── PAGE ───────────────────────────────────────────────── -->
    <div class="dash-page">
      <div class="dash-panel active" id="panel-chat">
        <div class="chat-overlay chat-embedded" id="chatOverlay">
          <div class="chat-list-view" id="chatListView">
            <div class="chat-list-body" id="chatListBody">
              <div class="chat-empty-state">
                <div class="icon">💬</div>
                <h3>No conversations yet</h3>
                <p>Your chats will show up here.</p>
              </div>
            </div>
          </div>
          <div class="chat-thread-view" id="chatThreadView">
            <div class="chat-thread-header">
              <button class="chat-back-btn" onclick="backToChatList()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                  <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <div class="chat-thread-avatar" id="chatThreadAvatar"></div>
              <div class="chat-thread-info">
                <div class="chat-thread-name" id="chatThreadName"></div>
                <div class="chat-thread-status" id="chatThreadStatus"></div>
              </div>
            </div>
            <div class="chat-thread-body" id="chatThreadBody"></div>
            <div class="chat-thread-input-bar">
              <input type="text" class="chat-input" id="chatInput" placeholder="Type a message…" maxlength="1000" autocomplete="off">
              <button class="chat-send-btn" id="chatSendBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

  <!-- Google Translate -->
  <div id="google_translate_element" style="display:none;"></div>
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,hi,bn,te,mr,ta,gu,kn,ml,pa,or,as,ur,ne,mai,sa,sd,sat,doi,bho,tcy',
        autoDisplay: false,
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
