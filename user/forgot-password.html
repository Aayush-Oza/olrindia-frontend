<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - OLR India</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css?v=1">
  <link rel="stylesheet" href="../css/base.css?v=1">
  <link rel="stylesheet" href="../css/components.css?v=1">
  <link rel="stylesheet" href="../css/auth.css?v=1">
</head>

<body>
  <div class="auth-screen">
    <div class="auth-card">

      <div class="auth-logo-badge">
        <img src="../assets/logo.png?v=1" alt="OLR India">
        <span>OLR India</span>
      </div>

      <div class="auth-form-header">
        <h1>Reset your password</h1>
        <p>Enter the email linked to your account and we'll send you a reset link.</p>
      </div>

      <form id="forgotForm" novalidate>
        <div class="field" data-field="email">
          <label class="label" for="email">Email address</label>
          <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email"
            required>
          <div class="field-error"></div>
        </div>
        <button type="submit" class="btn btn-primary">
          <span class="btn-label">Send reset link</span>
          <span class="spinner"></span>
        </button>
      </form>

      <div class="auth-form-footer">
        Remembered your password? <a href="/user/login">Log in</a>
      </div>

    </div>
  </div>
  <script src="../js/api.js?v=2"></script>
  <script src="../js/ui.js?v=1"></script>
  <script src="../js/helpers.js?v=1"></script>
  <script src="../js/user-auth.js?v=3"></script>
</body>

</html>
