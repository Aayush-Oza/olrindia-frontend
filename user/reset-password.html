<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - OLR India</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css?v=1">
  <link rel="stylesheet" href="../css/base.css?v=1">
  <link rel="stylesheet" href="../css/components.css?v=1">
  <link rel="stylesheet" href="../css/auth.css?v=1">
</head>

<body>
  <div class="auth-screen">
    <div class="auth-card">

      <div class="auth-logo-badge">
        <img src="../assets/logo.png?v=1" alt="OLR India">
        <span>OLR India</span>
      </div>

      <div class="auth-form-header">
        <h1>Set a new password</h1>
        <p>Make sure it's something you'll remember but hard to guess.</p>
      </div>

      <form id="resetForm" novalidate>
        <div class="field" data-field="new_password">
          <label class="label" for="new_password">New password</label>
          <div class="input-wrap">
            <input class="input" type="password" id="new_password" name="new_password"
              placeholder="Create a new password" autocomplete="new-password" required>
            <button type="button" class="pw-toggle" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.7" />
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7" />
              </svg>
            </button>
          </div>
          <div class="pw-strength">
            <div class="pw-strength-bar"></div>
            <div class="pw-strength-bar"></div>
            <div class="pw-strength-bar"></div>
          </div>
          <div class="pw-strength-label"></div>
          <div class="field-error"></div>
        </div>
        <div class="field" data-field="confirm_password">
          <label class="label" for="confirm_password">Confirm new password</label>
          <div class="input-wrap">
            <input class="input" type="password" id="confirm_password" name="confirm_password"
              placeholder="Re-enter new password" autocomplete="new-password" required>
            <button type="button" class="pw-toggle" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.7" />
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7" />
              </svg>
            </button>
          </div>
          <div class="field-error"></div>
        </div>
        <button type="submit" class="btn btn-primary">
          <span class="btn-label">Reset password</span>
          <span class="spinner"></span>
        </button>
      </form>

      <div class="auth-form-footer"><a href="/user/login">Back to login</a></div>

    </div>
  </div>
  <script src="../js/api.js?v=1"></script>
  <script src="../js/ui.js?v=1"></script>
  <script src="../js/helpers.js?v=2"></script>
  <script src="../js/user/user-auth.js?v=1"></script>
</body>

</html>
