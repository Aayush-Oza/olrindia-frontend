<body>
  <div class="auth-screen">
    <div class="auth-card wide">

      <div class="auth-logo-badge">
        <img src="../assets/logo.png?v=1" alt="OLR India">
        <span>OLR India</span>
      </div>

      <div class="auth-form-header">
        <h1>Create your account</h1>
        <p>Sign up as a customer to start exploring rentals near you.</p>
      </div>

      <button class="btn-google" id="googleSignInBtn" type="button">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335"
            d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.7 2.4 30.2 0 24 0 14.7 0 6.7 5.4 2.8 13.3l7.8 6C12.4 13 17.8 9.5 24 9.5z" />
          <path fill="#4285F4"
            d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.9-10 6.9-17z" />
          <path fill="#FBBC05"
            d="M10.6 28.7A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A24 24 0 0 0 0 24c0 3.9.9 7.5 2.5 10.8l8.1-6.1z" />
          <path fill="#34A853"
            d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.2 0-11.5-4.2-13.4-9.9l-8.1 6.1C6.6 42.6 14.7 48 24 48z" />
        </svg>
        Sign up with Google
      </button>

      <div class="auth-or">OR</div>

      <form id="signupForm" novalidate>
        <div class="field" data-field="name">
          <label class="label" for="name">Full name</label>
          <input class="input" type="text" id="name" name="name" placeholder="John Doe" autocomplete="name" required>
          <div class="field-error"></div>
        </div>

        <div class="field-row">
          <div class="field" data-field="email">
            <label class="label" for="email">Email address</label>
            <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email"
              required>
            <div class="field-error"></div>
          </div>
          <div class="field" data-field="mobile">
            <label class="label" for="mobile">Mobile <span class="opt">(optional)</span></label>
            <input class="input" type="tel" id="mobile" name="mobile" placeholder="9876543210" maxlength="10"
              autocomplete="tel">
            <div class="field-error"></div>
          </div>
        </div>

        <div class="field-row">
          <div class="field" data-field="password">
            <label class="label" for="password">Password</label>
            <div class="input-wrap">
              <input class="input" type="password" id="password" name="password" placeholder="Create a password"
                autocomplete="new-password" required>
              <button type="button" class="pw-toggle" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.7" />
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7" />
                </svg>
              </button>
            </div>
            <div class="pw-strength">
              <div class="pw-strength-bar"></div>
              <div class="pw-strength-bar"></div>
              <div class="pw-strength-bar"></div>
            </div>
            <div class="pw-strength-label"></div>
            <div class="field-error"></div>
          </div>
          <div class="field" data-field="confirm_password">
            <label class="label" for="confirm_password">Confirm password</label>
            <div class="input-wrap">
              <input class="input" type="password" id="confirm_password" name="confirm_password"
                placeholder="Re-enter password" autocomplete="new-password" required>
              <button type="button" class="pw-toggle" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.7" />
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7" />
                </svg>
              </button>
            </div>
            <div class="field-error"></div>
          </div>
        </div>
        <div class="field-hint" style="margin:-8px 0 16px;">8+ characters with uppercase, lowercase, number and a
          special character.</div>

        <div class="field" data-field="pincode">
          <label class="label" for="pincode">Pincode <span class="opt">(optional - auto-fills location)</span></label>
          <input class="input" type="text" id="pincode" name="pincode" placeholder="400068" maxlength="6"
            inputmode="numeric">
          <div class="field-hint pincode-status"></div>
        </div>

        <div class="field-row">
          <div class="field" data-field="city">
            <label class="label" for="city">City</label>
            <input class="input" type="text" id="city" name="city" placeholder="Auto-filled or enter manually">
          </div>
          <div class="field" data-field="state">
            <label class="label" for="state">State</label>
            <input class="input" type="text" id="state" name="state" placeholder="Auto-filled or enter manually">
          </div>
        </div>

        <div class="field" data-field="area">
          <label class="label" for="area">Area <span class="opt">(optional)</span></label>
          <input class="input" type="text" id="area" name="area" placeholder="Auto-filled or enter manually">
        </div>

        <input type="hidden" name="latitude">
        <input type="hidden" name="longitude">
        <button type="button" class="btn btn-secondary use-location-btn" style="margin-bottom:20px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="margin-right:6px;">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" />
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          Use my current location
        </button>

        <label class="checkbox-row" style="margin-bottom:22px;">
          <input type="checkbox" name="terms" required>
          <span>I agree to OLR India's <a href="/terms">Terms of Service</a> and <a
              href="/privacy">Privacy Policy</a>.</span>
        </label>

        <button type="submit" class="btn btn-primary">
          <span class="btn-label">Create account</span>
          <span class="spinner"></span>
        </button>
      </form>

      <div class="auth-form-footer">
        Already have an account? <a href="/user/login">Log in</a>
      </div>

    </div>
  </div>

  <script src="../js/user-auth.js?v=2"></script>
</body>
