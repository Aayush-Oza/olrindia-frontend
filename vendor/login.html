<body>
  <div class="auth-screen">
    <div class="auth-card">

      <div class="auth-logo-badge">
        <img src="../assets/logo.png?v=1" alt="OLR India">
        <span>OLR India</span>
      </div>

      <div class="auth-form-header">
        <h1>Vendor login</h1>
        <p>Log in to manage your business on OLR India.</p>
      </div>

      <button class="btn-google" id="googleSignInBtn" type="button">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335"
            d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.7 2.4 30.2 0 24 0 14.7 0 6.7 5.4 2.8 13.3l7.8 6C12.4 13 17.8 9.5 24 9.5z" />
          <path fill="#4285F4"
            d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.9-10 6.9-17z" />
          <path fill="#FBBC05"
            d="M10.6 28.7A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A24 24 0 0 0 0 24c0 3.9.9 7.5 2.5 10.8l8.1-6.1z" />
          <path fill="#34A853"
            d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.2 0-11.5-4.2-13.4-9.9l-8.1 6.1C6.6 42.6 14.7 48 24 48z" />
        </svg>
        Continue with Google
      </button>

      <div class="auth-or">OR</div>

      <form id="loginForm" novalidate>
        <div class="field" data-field="email">
          <label class="label" for="email">Email address</label>
          <div class="input-wrap">
            <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email"
              required>
          </div>
          <div class="field-error"></div>
        </div>

        <div class="field" data-field="password">
          <label class="label" for="password">Password</label>
          <div class="input-wrap">
            <input class="input" type="password" id="password" name="password" placeholder="Enter your password"
              autocomplete="current-password" required>
            <button type="button" class="pw-toggle" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.7" />
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7" />
              </svg>
            </button>
          </div>
          <div class="field-error"></div>
        </div>

        <div style="display:flex;justify-content:flex-end;margin-bottom:20px;">
          <a href="/vendor/forgot-password" style="font-size:13px;">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary">
          <span class="btn-label">Log in</span>
          <span class="spinner"></span>
        </button>
      </form>

      <div class="auth-form-footer">
        New vendor? <a href="/vendor/signup">Register your business</a>
      </div>
      <div style="text-align:center;margin-top:4px;">
        <a href="/" class="auth-browse-link">
          🛍️ Browse products - no account needed
        </a>
      </div>

      <div class="auth-trust-row">
        <div class="auth-trust-item">
          <div class="auth-trust-dot">✓</div>Verified badge
        </div>
        <div class="auth-trust-item">
          <div class="auth-trust-dot">✓</div>Local customers
        </div>
        <div class="auth-trust-item">
          <div class="auth-trust-dot">✓</div>Free to list
        </div>
      </div>

    </div>
  </div>
  <script src="../js/api.js?v=2"></script>
  <script src="../js/ui.js?v=1"></script>
  <script src="../js/helpers.js?v=1"></script>
  <script type="module" src="../js/firebase-config.js?v=1"></script>
  <script src="../js/vendor-auth.js?v=2"></script>
</body>

</html>
